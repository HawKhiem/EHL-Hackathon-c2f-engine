[project]
name = "hackathon-backend"
version = "0.1.0"
description = "FastAPI + Supabase + provider-agnostic LLM wrapper."
requires-python = ">=3.11"

# The single source of truth for backend dependencies.
# Add one with:  uv add <package>      (from the backend/ directory)
# Remove one:    uv remove <package>
# Both update uv.lock, which is committed so the whole team resolves
# to byte-identical versions.
dependencies = [
    # Web
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    # Config
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    # Data / auth
    "supabase==2.31.0",
    # LLM providers. `anthropic` is the default; `openai` is only imported
    # when LLM_PROVIDER=openai, but is installed so switching needs no
    # re-install.
    "anthropic==0.125.0",
    "openai==3.3.1",
]

[dependency-groups]
# Installed by `uv sync`, excluded by `uv sync --no-dev`.
dev = [
    "ruff>=0.14.0",
]

[tool.uv]
# This is an application, not an installable library.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
