name: CI

# Verification only - no deployment. Runs on every push and PR so a broken
# main is visible before game time instead of at it.
on:
  push:
  pull_request:

# A new push supersedes the previous run on the same ref. Without this,
# rapid-fire hackathon pushes queue up and the useful result arrives last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: c2f (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          cache: true

      - name: Test
        run: pixi run python -m pytest -q tests
