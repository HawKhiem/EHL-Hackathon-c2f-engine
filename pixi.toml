[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = ">=3.9"
requests = "*"
openai = "*"
pypdf = ">=6.16.1,<7"
pytest = ">=9.1.1,<10"

# p7zip provides the `7z` command on Unix; Windows uses the `7zip` package instead.
[target.unix.dependencies]
p7zip = "*"
[target.win-64.dependencies]
7zip = "*"
